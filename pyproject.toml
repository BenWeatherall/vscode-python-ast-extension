[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "python-vis"
version = "0.1.0"
description = "Python AST visualization for VS Code"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "ruff>=0.1.0",
    "mypy>=1.0.0",
    "pyinstaller>=6.0.0",
]

[project.scripts]

[tool.hatch.build.targets.wheel]
packages = ["python_service"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]

[tool.mypy]
python_version = "3.12"
strict = true

[tool.pytest.ini_options]
cache_dir = ".pytest_cache"
testpaths = ["tests"]
